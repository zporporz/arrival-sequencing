name: Harden sequence writes

on:
  push:
    paths:
      - 'scripts/harden-sequence-writes.mjs'
      - '.github/workflows/harden-sequence-writes.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply write hardening
        run: node scripts/harden-sequence-writes.mjs
      - name: Verify build
        run: |
          npm install --no-package-lock
          npm run build
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/harden-sequence-writes.mjs .github/workflows/harden-sequence-writes.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Route live sequence writes through authenticated API"
          git push
