name: Patch online controller presence

on:
  push:
    paths:
      - 'scripts/patch-online-presence.mjs'
      - '.github/workflows/patch-online-presence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/patch-online-presence.mjs
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-online-presence.mjs .github/workflows/patch-online-presence.yml package-lock.json
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Show online controller presence details"
          git push
