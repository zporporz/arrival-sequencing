name: Fix AIP source-only diff

on:
  push:
    paths:
      - 'scripts/fix-aip-source-diff.mjs'
      - '.github/workflows/fix-aip-source-diff.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source-only diff fix
        run: node scripts/fix-aip-source-diff.mjs
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/fix-aip-source-diff.mjs .github/workflows/fix-aip-source-diff.yml package-lock.json
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Ignore source-only AIP import diffs"
          git push
