name: Patch AIP IAWP routing

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-aip-iawp-routing.cjs'
      - '.github/workflows/patch-aip-iawp-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-aip-iawp-routing.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use CAAT AIP transition mappings for arrival IAWP"
          git push
