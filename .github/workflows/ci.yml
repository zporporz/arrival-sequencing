name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check Pages Functions syntax
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build
        run: npm run build
