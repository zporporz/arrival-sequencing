name: Finish multi-airport core

on:
  push:
    paths:
      - 'scripts/finish-multi-airport.mjs'
      - '.github/workflows/finish-multi-airport.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply refactor
        run: node scripts/finish-multi-airport.mjs
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/finish-multi-airport.mjs .github/workflows/finish-multi-airport.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finish dynamic multi-airport live core"
          git push
