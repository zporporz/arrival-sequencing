name: Patch AUTO ETO ETA window

on:
  push:
    paths:
      - 'scripts/patch-auto-eto-eta-window.mjs'
      - '.github/workflows/patch-auto-eto-eta-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/patch-auto-eto-eta-window.mjs
      - name: Install
        run: npm install
      - name: Check functions
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-auto-eto-eta-window.mjs .github/workflows/patch-auto-eto-eta-window.yml package-lock.json
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Gate AUTO ETO by destination ETA window"
          git push
