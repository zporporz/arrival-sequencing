name: Patch AMAN V2 readability and actions
on:
  push:
    paths:
      - 'scripts/patch-aman-v2-readability-actions.cjs'
      - '.github/workflows/patch-aman-v2-readability-actions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AMAN V2 fixes
        run: node scripts/patch-aman-v2-readability-actions.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve AMAN V2 controls and readability" || exit 0
          git push
