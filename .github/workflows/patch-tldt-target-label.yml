name: Patch TLDT target label
on:
  push:
    paths:
      - 'scripts/patch-tldt-target-label.cjs'
      - '.github/workflows/patch-tldt-target-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/patch-tldt-target-label.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Target Landing Time labels for TLDT" || exit 0
          git push
