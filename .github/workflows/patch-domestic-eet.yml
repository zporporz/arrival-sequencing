name: Patch domestic EET AUTO ETO

on:
  push:
    paths:
      - '.github/scripts/patch-domestic-eet.py'
      - '.github/workflows/patch-domestic-eet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-domestic-eet.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check IVAO function
        run: node --check functions/api/sequence/ivao-traffic.js
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch-domestic-eet.py .github/workflows/patch-domestic-eet.yml
          git add src/IvaoTrafficPanel.tsx README.md
          git commit -m "Use tracked takeoff plus filed EET for domestic AUTO ETO"
          git push
