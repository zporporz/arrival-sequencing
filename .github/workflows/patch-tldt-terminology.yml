name: Patch TLDT terminology
on:
  push:
    paths:
      - 'scripts/patch-tldt-terminology.cjs'
      - '.github/workflows/patch-tldt-terminology.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply terminology patch
        run: node scripts/patch-tldt-terminology.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename CLDT display terminology to TLDT" || exit 0
          git push
