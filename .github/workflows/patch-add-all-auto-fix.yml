name: Patch Add All auto REF FIX

on:
  push:
    paths:
      - 'scripts/patch-add-all-auto-fix.py'
      - '.github/workflows/patch-add-all-auto-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/patch-add-all-auto-fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-add-all-auto-fix.py .github/workflows/patch-add-all-auto-fix.yml
          git add -A
          git commit -m "Add bulk IVAO import and automatic REF FIX assignment"
          git push
