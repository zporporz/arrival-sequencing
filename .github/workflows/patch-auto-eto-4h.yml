name: Patch AUTO ETO 4h

on:
  push:
    paths:
      - 'scripts/patch-auto-eto-4h.cjs'
      - '.github/workflows/patch-auto-eto-4h.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: node scripts/patch-auto-eto-4h.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend AUTO ETO window to 4 hours"
          git push
